<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Labyrinth" />
    <title>🏰 Labyrinth 2D</title>
    <meta name="description" content="Co-op online 2D pixel-art labyrinth game for up to 10 players." />
    <link
      rel="preload"
      href="./assets/audio/main-theme.mp3"
      as="audio"
      type="audio/mpeg"
      fetchpriority="high"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="game-container">
      <section
        id="loading-screen"
        class="loading-screen"
        role="status"
        aria-live="polite"
        aria-busy="true"
        aria-label="Loading Labyrinth 2D"
      >
        <audio
          id="loading-theme"
          src="./assets/audio/main-theme.mp3"
          preload="auto"
          autoplay
          loop
          aria-hidden="true"
        ></audio>
        <script>
          (() => {
            const theme = document.getElementById('loading-theme');
            const startTheme = () => {
              theme.volume = 0.42;
              theme.currentTime = 4;
              void theme.play().catch(() => undefined);
            };

            if (theme.readyState >= 1) startTheme();
            else theme.addEventListener('loadedmetadata', startTheme, { once: true });
          })();
        </script>
        <div class="loading-screen__mist" aria-hidden="true"></div>
        <div class="loading-screen__content">
          <div class="loading-screen__gate" aria-hidden="true">
            <span class="loading-screen__gate-rune">◆</span>
          </div>

          <h1 class="loading-screen__title">Labyrinth</h1>
          <p class="loading-screen__subtitle">Find the path. Trust no one.</p>

          <div class="loading-screen__progress-frame">
            <div
              id="loading-progress"
              class="loading-screen__progress"
              role="progressbar"
              aria-label="Game loading progress"
              aria-valuemin="0"
              aria-valuemax="100"
              aria-valuenow="4"
            ></div>
          </div>

          <div class="loading-screen__readout">
            <span id="loading-status">Entering the labyrinth…</span>
            <span id="loading-percent" aria-hidden="true">04%</span>
          </div>
        </div>
      </section>
      <!-- PixiJS creates and appends its <canvas> after the loading screen. -->
    </div>
    <button
      id="fullscreen-toggle"
      class="fullscreen-toggle"
      type="button"
      aria-label="Enter fullscreen"
      aria-pressed="false"
      title="Enter fullscreen"
    >
      <svg
        class="fullscreen-toggle__icon fullscreen-toggle__icon--enter"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5" />
      </svg>
      <svg
        class="fullscreen-toggle__icon fullscreen-toggle__icon--exit"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5" />
      </svg>
    </button>
    <div
      id="ios-fullscreen-help"
      class="fullscreen-help"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ios-fullscreen-help-title"
      hidden
    >
      <div class="fullscreen-help__panel">
        <button
          id="ios-fullscreen-help-close"
          class="fullscreen-help__close"
          type="button"
          aria-label="Close fullscreen instructions"
          title="Close"
        >
          ×
        </button>
        <h2 id="ios-fullscreen-help-title">Fullscreen on iPhone</h2>
        <p id="ios-fullscreen-help-message">
          Safari can open this game fullscreen from your Home Screen.
        </p>
        <ol id="ios-fullscreen-help-steps" class="fullscreen-help__steps">
          <li>
            Tap Safari’s
            <span class="fullscreen-help__share-icon" aria-label="Share">⇧</span>
            <strong>Share</strong> button.
          </li>
          <li>Choose <strong>Add to Home Screen</strong>, then tap <strong>Add</strong>.</li>
          <li>Open <strong>Labyrinth</strong> from your Home Screen.</li>
        </ol>
        <button id="ios-fullscreen-help-ok" class="fullscreen-help__ok" type="button">
          Got it
        </button>
      </div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
